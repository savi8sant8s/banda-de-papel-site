<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Paper Band</title>
  <meta name="description" content="Like the videos? Support with Bitcoin.">
  <link rel="canonical" href="https://bandadepapel.cloud/en/support.html">
  <meta property="og:title" content="Support Paper Band">
  <meta property="og:description" content="Like the videos? Support with Bitcoin.">
  <meta property="og:image" content="https://bandadepapel.cloud/assets/kits/forro.jpg">
  <link rel="icon" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="wrap thanks">
    <div class="paper tilt-l support">
      <img src="../assets/avatar.png" alt="">
      <h1>Support with Bitcoin</h1>
      <p class="lead">Enjoying the videos or the kits? Any amount helps keep them coming.</p>
      <img class="qr" src="../assets/bitcoin.png" alt="Bitcoin address QR code">
      <textarea id="btc" readonly rows="2">bc1q7zyg6vjuqrzs87p2w3x9tp60eta7x5uuhquy8z</textarea>
      <button class="btn" type="button" id="copiar-btc">Copy address</button>
      <p class="note">Bitcoin network (on-chain). Double-check the address before sending.</p>
      <p><a href="./">Back to the site</a></p>
    </div>
  </main>
  <script>
    document.querySelector("#copiar-btc").addEventListener("click", async (ev) => {
      const t = document.querySelector("#btc");
      try { await navigator.clipboard.writeText(t.value.trim()); } catch { t.select(); document.execCommand("copy"); }
      ev.target.textContent = "Copied!";
    });
  </script>
</body>
</html>
